<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>돈 축사 CFD 데이터 Three.js 대시보드 (기술 검토용 데모)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f5f7fa; color:#1c2129; font-family: -apple-system, "Malgun Gothic", sans-serif; overflow:hidden; }
  #app { position:relative; width:100vw; height:100vh; }
  canvas { display:block; }
  #mainCanvas { width:100%; height:100%; }
  #detailCanvas { width:100%; height:100%; }

  /* 상세 패널은 처음부터 항상 열려있다 — 3D 뷰 폭은 패널 폭만큼 줄어든 채 고정이라
     패널이 축사(자돈사 A동)를 가리지 않는다. 클릭으로 열고/닫는 인터렉션은 없다. */
  #overview { position:absolute; inset:0; right:760px; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .barn-label {
    position:absolute; transform:translate(-50%,-100%);
    background:rgba(255,255,255,0.92); border:1px solid #d7dee6; border-radius:6px;
    padding:4px 10px; font-size:13px; white-space:nowrap; pointer-events:none;
    color:#1c2129; box-shadow:0 2px 8px rgba(20,30,45,0.08);
  }

  #detailPanel {
    position:absolute; top:0; right:0; height:100%; width:760px;
    background:#ffffff; border-left:1px solid #e1e6ec;
    display:flex; flex-direction:column; box-shadow:-12px 0 30px rgba(20,30,45,0.12);
  }
  #detailHeader { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid #e1e6ec; }
  #detailHeader h2 { margin:0; font-size:16px; font-weight:600; color:#1c2129; }
  #detailCanvasWrap { width:100%; height:640px; position:relative; border-bottom:1px solid #e1e6ec; background:#f5f7fa; }
  #hoverTooltip {
    position:absolute; display:none; pointer-events:none; z-index:5;
    background:rgba(255,255,255,0.96); border:1px solid #d7dee6; border-radius:6px;
    padding:6px 9px; font-size:11px; line-height:1.5; color:#1c2129; white-space:nowrap;
    box-shadow:0 2px 8px rgba(20,30,45,0.1);
  }
  #hoverTooltip .k { color:#8a94a3; }

  #infoGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 18px; }
  .infoCard { background:#f5f7fa; border:1px solid #e1e6ec; border-radius:8px; padding:10px 12px; }
  .infoCard .k { font-size:11px; color:#8a94a3; margin-bottom:4px; }
  .infoCard .v { font-size:18px; font-weight:600; color:#1c2129; }

  #detailControls { padding:0 18px 18px; font-size:13px; color:#1c2129; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .row label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .row input[type=range] { flex:1; }
  .row span.val { min-width:44px; text-align:right; color:#8a94a3; }
  #timeRow { display:flex; align-items:center; gap:10px; margin-top:4px; }
  #timeRow button { background:#2a5b8f; border:none; color:#fff; border-radius:6px; width:30px; height:28px; cursor:pointer; font-size:13px; }
  #timeRow .t { min-width:48px; text-align:center; color:#1c2129; font-variant-numeric:tabular-nums; font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="overview">
    <canvas id="mainCanvas"></canvas>
    <div id="labels"></div>
  </div>

  <aside id="detailPanel">
    <div id="detailHeader">
      <h2 id="barnTitle">-</h2>
    </div>
    <div id="detailCanvasWrap">
      <canvas id="detailCanvas"></canvas>
      <div id="hoverTooltip"></div>
    </div>
    <div id="infoGrid">
      <div class="infoCard"><div class="k">평균 온도</div><div class="v" id="infoTemp">-</div></div>
      <div class="infoCard"><div class="k">습도</div><div class="v" id="infoHum">-</div></div>
      <div class="infoCard"><div class="k">ACH</div><div class="v" id="infoAch">-</div></div>
      <div class="infoCard"><div class="k">경과 시간</div><div class="v" id="infoTime">-</div></div>
    </div>
    <div id="detailControls">
      <div class="row">
        <label><input type="checkbox" id="toggleVolume" checked /> 입체 확산 (등온면)</label>
      </div>
      <div class="row">
        <span>확산 강도</span>
        <input type="range" id="threshold" min="0.5" max="2" step="0.05" value="1" />
        <span class="val" id="thresholdVal">1.00</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="toggleVec" checked /> 기류 흐름 표시</label>
      </div>
      <div id="timeRow">
        <button id="playBtn">▶</button>
        <input type="range" id="timeSlider" min="0" max="30" step="1" value="0" />
        <div class="t" id="timeLabel">0분</div>
      </div>
    </div>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
