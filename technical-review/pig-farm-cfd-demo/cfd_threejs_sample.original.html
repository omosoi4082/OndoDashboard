<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>돈 축사 CFD 데이터 Three.js 대시보드 (단일 페이지)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e1116; color:#e6e6e6; font-family: -apple-system, "Malgun Gothic", sans-serif; overflow:hidden; }
  #app { position:relative; width:100vw; height:100vh; }
  canvas { display:block; }
  #mainCanvas { width:100%; height:100%; }
  #detailCanvas { width:100%; height:100%; }

  #overview { position:absolute; inset:0; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .barn-label {
    position:absolute; transform:translate(-50%,-100%);
    background:rgba(20,24,32,0.85); border:1px solid #333c4a; border-radius:6px;
    padding:4px 10px; font-size:13px; white-space:nowrap; pointer-events:none;
  }
  #hint {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(20,24,32,0.85); border:1px solid #333c4a; border-radius:8px;
    padding:8px 16px; font-size:13px; color:#9aa4b2;
  }

  #detailPanel {
    position:absolute; top:0; right:0; height:100%; width:420px;
    background:#151920; border-left:1px solid #2a303c;
    transform:translateX(100%); transition:transform .35s ease;
    display:flex; flex-direction:column; box-shadow:-12px 0 30px rgba(0,0,0,0.35);
  }
  #detailPanel.open { transform:translateX(0); }
  #detailHeader { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid #2a303c; }
  #detailHeader h2 { margin:0; font-size:16px; font-weight:600; color:#fff; }
  #closeBtn { background:none; border:1px solid #333c4a; color:#e6e6e6; border-radius:6px; width:30px; height:30px; cursor:pointer; font-size:15px; line-height:1; }
  #detailCanvasWrap { width:100%; height:260px; position:relative; border-bottom:1px solid #2a303c; }
  #hoverTooltip {
    position:absolute; display:none; pointer-events:none; z-index:5;
    background:rgba(10,13,18,0.92); border:1px solid #333c4a; border-radius:6px;
    padding:6px 9px; font-size:11px; line-height:1.5; color:#e6e6e6; white-space:nowrap;
  }
  #hoverTooltip .k { color:#9aa4b2; }

  #infoGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 18px; }
  .infoCard { background:#1c2129; border:1px solid #2a303c; border-radius:8px; padding:10px 12px; }
  .infoCard .k { font-size:11px; color:#9aa4b2; margin-bottom:4px; }
  .infoCard .v { font-size:18px; font-weight:600; color:#fff; }

  #detailControls { padding:0 18px 18px; font-size:13px; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .row label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .row input[type=range] { flex:1; }
  .row span.val { min-width:44px; text-align:right; color:#9aa4b2; }
  #timeRow { display:flex; align-items:center; gap:10px; margin-top:4px; }
  #timeRow button { background:#2a5b8f; border:none; color:#fff; border-radius:6px; width:30px; height:28px; cursor:pointer; font-size:13px; }
  #timeRow .t { min-width:48px; text-align:center; color:#e6e6e6; font-variant-numeric:tabular-nums; font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="overview">
    <canvas id="mainCanvas"></canvas>
    <div id="labels"></div>
    <div id="hint">축사를 클릭하면 상세 정보를 확인할 수 있습니다</div>
  </div>

  <aside id="detailPanel">
    <div id="detailHeader">
      <h2 id="barnTitle">-</h2>
      <button id="closeBtn">×</button>
    </div>
    <div id="detailCanvasWrap">
      <canvas id="detailCanvas"></canvas>
      <div id="hoverTooltip"></div>
    </div>
    <div id="infoGrid">
      <div class="infoCard"><div class="k">평균 온도</div><div class="v" id="infoTemp">-</div></div>
      <div class="infoCard"><div class="k">습도</div><div class="v" id="infoHum">-</div></div>
      <div class="infoCard"><div class="k">ACH</div><div class="v" id="infoAch">-</div></div>
      <div class="infoCard"><div class="k">경과 시간</div><div class="v" id="infoTime">-</div></div>
    </div>
    <div id="detailControls">
      <div class="row">
        <label><input type="checkbox" id="toggleVolume" checked /> 입체 확산 (등온면)</label>
      </div>
      <div class="row">
        <span>확산 강도</span>
        <input type="range" id="threshold" min="0.5" max="2" step="0.05" value="1" />
        <span class="val" id="thresholdVal">1.00</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="toggleVec" checked /> 기류 흐름 표시</label>
      </div>
      <div id="timeRow">
        <button id="playBtn">▶</button>
        <input type="range" id="timeSlider" min="0" max="30" step="1" value="0" />
        <div class="t" id="timeLabel">0분</div>
      </div>
    </div>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MarchingCubes } from "three/addons/objects/MarchingCubes.js";

/* ────────────────────────────────────────────────────────────
   공용: 방 크기 / 컬러맵 / 캔버스 안개 텍스처
──────────────────────────────────────────────────────────── */
const ROOM = { w: 8, h: 3, d: 5 };

const STOPS = [
  [0.00, [0.19, 0.30, 0.85]],
  [0.30, [0.10, 0.60, 0.85]],
  [0.55, [0.35, 0.80, 0.35]],
  [0.75, [0.95, 0.80, 0.15]],
  [1.00, [0.90, 0.20, 0.15]],
];
function colormap(t) {
  t = Math.min(Math.max(t, 0), 1);
  for (let i = 0; i < STOPS.length - 1; i++) {
    const [t0, c0] = STOPS[i], [t1, c1] = STOPS[i + 1];
    if (t >= t0 && t <= t1) {
      const f = (t - t0) / (t1 - t0);
      return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
    }
  }
  return STOPS[STOPS.length - 1][1];
}

// 합성(예시) CFD 데이터 함수 — barn.seed / barn.ach로 축사별 차이를 줌.
// 실제 연동 시: 여기를 barnId + tMin 기준으로 서버에서 받아온 실제 프레임 값으로 교체하면 됩니다.
function sampleTemperatureAt(x, y, z, tMin, barn) {
  const effMin = tMin * (barn.ach / 20); // ACH가 높을수록 더 빨리 섞임
  const mix = Math.min(effMin / 60, 1);
  const inletX = 0.8 + barn.seed * 0.4, inletZ = 0.8 + barn.seed * 0.3;
  const distToInlet = Math.hypot(x - inletX, y - 2.6, z - inletZ);
  const spreadRadius = 1.2 + mix * 3.5;
  const jet = Math.exp(-(distToInlet / spreadRadius) * 2.2);
  const swirl = 0.06 * Math.sin(x * 1.3 + effMin * 0.05 + barn.seed) * Math.cos(z * 1.1 - effMin * 0.04);
  const base = 0.15 + 0.35 * mix;
  return Math.min(Math.max(base + jet * 0.85 + swirl, 0), 1);
}

/* ────────────────────────────────────────────────────────────
   축사 3개 설정 (실제로는 서버/CMS에서 가져올 목록)
──────────────────────────────────────────────────────────── */
const BARNS = [
  { id: 0, name: "자돈사 A동", ach: 20, supplyTemp: 30, humidity: 62, seed: 0.0, pos: new THREE.Vector3(0, 0, 0) },
  { id: 1, name: "자돈사 B동", ach: 15, supplyTemp: 28, humidity: 58, seed: 1.7, pos: new THREE.Vector3(6, 0, 0) },
  { id: 2, name: "자돈사 C동", ach: 25, supplyTemp: 31, humidity: 65, seed: 3.3, pos: new THREE.Vector3(12, 0, 0) },
];

/* ────────────────────────────────────────────────────────────
   ① 개요(overview) 씬 — 축사 3개, 클릭으로 선택
──────────────────────────────────────────────────────────── */
const mainCanvas = document.getElementById("mainCanvas");
const mainRenderer = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true });
mainRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const mainScene = new THREE.Scene();
mainScene.background = new THREE.Color(0x0e1116);
mainScene.add(new THREE.AmbientLight(0xffffff, 0.8));
const mainDir = new THREE.DirectionalLight(0xffffff, 0.5);
mainDir.position.set(6, 12, 8);
mainScene.add(mainDir);

const mainCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
mainCamera.position.set(3, 6, 16);
const mainControls = new OrbitControls(mainCamera, mainRenderer.domElement);
mainControls.target.set(6, 1, 0);
mainControls.enableDamping = true;

const hitMeshes = [];
BARNS.forEach((barn) => {
  const group = new THREE.Group();
  group.position.copy(barn.pos);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(ROOM.w * 0.5, ROOM.h * 0.5, ROOM.d * 0.5)),
    new THREE.LineBasicMaterial({ color: 0x5b6472 })
  );
  edges.position.set(0, ROOM.h * 0.25, 0);
  group.add(edges);

  const hit = new THREE.Mesh(
    new THREE.BoxGeometry(ROOM.w * 0.5, ROOM.h * 0.5, ROOM.d * 0.5),
    new THREE.MeshBasicMaterial({ color: 0x3b8bd4, transparent: true, opacity: 0.06 })
  );
  hit.position.set(0, ROOM.h * 0.25, 0);
  hit.userData.barnId = barn.id;
  group.add(hit);
  hitMeshes.push(hit);

  mainScene.add(group);
});

// 라벨 (HTML 오버레이, 매 프레임 스크린 좌표로 갱신)
const labelsRoot = document.getElementById("labels");
const labelEls = BARNS.map((barn) => {
  const el = document.createElement("div");
  el.className = "barn-label";
  el.textContent = barn.name;
  labelsRoot.appendChild(el);
  return el;
});
function updateLabels() {
  BARNS.forEach((barn, i) => {
    const worldPos = barn.pos.clone().add(new THREE.Vector3(0, ROOM.h * 0.5 + 0.4, 0));
    const p = worldPos.project(mainCamera);
    const w = mainCanvas.clientWidth, h = mainCanvas.clientHeight;
    const x = (p.x * 0.5 + 0.5) * w;
    const y = (-p.y * 0.5 + 0.5) * h;
    labelEls[i].style.left = `${x}px`;
    labelEls[i].style.top = `${y}px`;
    labelEls[i].style.display = p.z > 1 ? "none" : "block";
  });
}

// 클릭 선택
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
mainCanvas.addEventListener("click", (ev) => {
  const rect = mainCanvas.getBoundingClientRect();
  mouseNDC.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, mainCamera);
  const hits = raycaster.intersectObjects(hitMeshes);
  if (hits.length > 0) selectBarn(hits[0].object.userData.barnId);
});
mainCanvas.addEventListener("pointermove", (ev) => {
  const rect = mainCanvas.getBoundingClientRect();
  mouseNDC.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, mainCamera);
  const hits = raycaster.intersectObjects(hitMeshes);
  mainCanvas.style.cursor = hits.length > 0 ? "pointer" : "default";
});

/* ────────────────────────────────────────────────────────────
   ② 상세(detail) 씬 — 우측 패널 안의 별도 렌더러/카메라
──────────────────────────────────────────────────────────── */
const detailCanvas = document.getElementById("detailCanvas");
const detailRenderer = new THREE.WebGLRenderer({ canvas: detailCanvas, antialias: true, alpha: true });
detailRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const detailScene = new THREE.Scene();
detailScene.add(new THREE.AmbientLight(0xffffff, 0.8));
const detailDir = new THREE.DirectionalLight(0xffffff, 0.6);
detailDir.position.set(5, 8, 6);
detailScene.add(detailDir);

const detailCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 50);
detailCamera.position.set(7, 5, 8);
const detailControls = new OrbitControls(detailCamera, detailRenderer.domElement);
detailControls.target.set(ROOM.w / 2, ROOM.h / 2, ROOM.d / 2);
detailControls.enableDamping = true;

const detailRoomBox = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(ROOM.w, ROOM.h, ROOM.d)),
  new THREE.LineBasicMaterial({ color: 0x4a5568 })
);
detailRoomBox.position.set(ROOM.w / 2, ROOM.h / 2, ROOM.d / 2);
detailScene.add(detailRoomBox);

function marker(scene, color, pos) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color }));
  m.position.copy(pos);
  scene.add(m);
}
marker(detailScene, 0x3b8bd4, new THREE.Vector3(0.8, 2.6, 0.8));
marker(detailScene, 0xd85a30, new THREE.Vector3(ROOM.w - 0.8, 0.4, ROOM.d - 0.8));

// 입체 확산 — Marching Cubes 등온면 (three.js 공식 애드온)
const mcMaterial = new THREE.MeshStandardMaterial({
  color: 0x3b8bd4, roughness: 0.35, metalness: 0.0,
  transparent: true, opacity: 0.85, side: THREE.DoubleSide,
});
const mcResolution = 28;
const mcEffect = new MarchingCubes(mcResolution, mcMaterial, false, false, 60000);
mcEffect.position.set(ROOM.w / 2, ROOM.h / 2, ROOM.d / 2);
mcEffect.scale.set(ROOM.w / 2, ROOM.h / 2, ROOM.d / 2);
mcEffect.isolation = 60;
detailScene.add(mcEffect);

/* field 인덱스 공식은 three.js MarchingCubes 내부 규약과 동일해야 합니다:
   idx = i + j*size + k*size*size  (i=x격자, j=y격자, k=z격자, 0~size-1)
   world 좌표는 i/(size-1) 비율로 0~ROOM 치수에 선형 매핑됩니다. */

// 실제 연동 시: 이 함수 내부를 "서버에서 받아온 frameIndex번째 CFD 프레임 배열"로
// 교체하면 됩니다. 지금은 임의 좌표에 sampleTemperatureAt()으로 테스트 값을 채웁니다.
function bakeFrames(barn) {
  if (barn._frames) return barn._frames;
  const size = mcResolution;
  const frames = [];
  for (let f = 0; f <= 30; f++) {
    const tMin = f * 2;
    const arr = new Float32Array(size * size * size);
    for (let k = 0; k < size; k++) {
      const z = ROOM.d * (k / (size - 1));
      for (let j = 0; j < size; j++) {
        const y = ROOM.h * (j / (size - 1));
        for (let i = 0; i < size; i++) {
          const x = ROOM.w * (i / (size - 1));
          const v = sampleTemperatureAt(x, y, z, tMin, barn); // 0~1 정규화 값
          arr[i + j * size + k * size * size] = v * 200; // isolation(60)과 비교 가능한 스케일로 변환
        }
      }
    }
    frames.push(arr);
  }
  barn._frames = frames;
  return frames;
}

let currentFrameArray = null; // 현재 프레임의 실제 격자값 — 호버 조회에 사용

function updateVolume(tMin, barn, spreadIntensity) {
  const frames = bakeFrames(barn);
  const frameIndex = Math.round(tMin / 2); // 0~30, 슬라이더 프레임과 그대로 대응
  currentFrameArray = frames[frameIndex];
  mcEffect.field.set(currentFrameArray);   // ← 공식/애니메이션 없이, 그 프레임 값을 통째로 주입
  mcEffect.isolation = 60 / spreadIntensity; // 강도를 올리면 임계값이 낮아져 표면이 더 넓게 잡힘
  mcEffect.update();

  const mix = Math.min((tMin * (barn.ach / 20)) / 60, 1);
  const [r, g, b] = colormap(0.3 + mix * 0.5);
  mcMaterial.color.setRGB(r, g, b);
}

// 기류 흐름 — 실제 유속장(u,v,w)을 따라 좌표를 적분해서 스트림라인 3개를 만듦
function flowDashTexture() {
  const c = document.createElement("canvas");
  c.width = 64; c.height = 8;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "rgba(255,255,255,0)";
  ctx.fillRect(0, 0, 64, 8);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillRect(4, 1, 26, 6);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const dashTexture = flowDashTexture();

// 임의 좌표(x,y,z)에서의 유속 벡터 — 실제 연동 시 CFD 프레임의 (u,v,w) 격자로 교체
function sampleVelocityAt(x, y, z, tMin, barn) {
  const inletX = 0.8 + barn.seed * 0.4, inletZ = 0.8 + barn.seed * 0.3;
  const decay = 1 - 0.3 * Math.min((tMin * (barn.ach / 20)) / 60, 1);
  const dist = Math.hypot(x - inletX, y - 2.6, z - inletZ);
  const jetMag = Math.exp(-dist * 0.35) * 1.4 * decay;
  const u = jetMag * 0.55 + 0.08 * Math.sin(z * 1.4 + tMin * 0.05);
  const v = -jetMag * 0.5;
  const w = jetMag * 0.55 + 0.08 * Math.cos(x * 1.4 - tMin * 0.05);
  return { u, v, w, mag: Math.hypot(u, v, w) };
}

// 시작점(seed)에서 출발해 유속 방향으로 한 걸음씩 이동하며 좌표를 쌓는 적분(스트림라인 추적)
function traceStreamline(seed, tMin, barn) {
  const pts = [new THREE.Vector3(seed[0], seed[1], seed[2])];
  let p = pts[0];
  const stepSize = 0.22;
  for (let i = 0; i < 40; i++) {
    const vel = sampleVelocityAt(p.x, p.y, p.z, tMin, barn);
    if (vel.mag < 0.02) break;
    const dir = new THREE.Vector3(vel.u, vel.v, vel.w).normalize();
    const next = p.clone().addScaledVector(dir, stepSize);
    if (next.x < 0 || next.x > ROOM.w || next.y < 0 || next.y > ROOM.h || next.z < 0 || next.z > ROOM.d) break;
    pts.push(next);
    p = next;
  }
  return pts;
}

function makeStreamTubeFromPoints(points) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, Math.max(points.length * 3, 20), 0.045, 8, false);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x5dcaa5, emissive: 0x0f6e56, emissiveIntensity: 0.4,
    map: dashTexture, transparent: true, roughness: 0.4,
  });
  mat.map.repeat.set(10, 1);
  return new THREE.Mesh(geo, mat);
}

const streamGroup = new THREE.Group();
detailScene.add(streamGroup);

let lastStreamKey = null;
function rebuildStreamlines(tMin, barn) {
  const key = `${tMin}-${barn.id}`;
  if (key === lastStreamKey) return; // 이 프레임으로 이미 만들어져 있으면 다시 추적하지 않음
  lastStreamKey = key;
  while (streamGroup.children.length) {
    const m = streamGroup.children.pop();
    m.geometry.dispose();
  }
  const inletX = 0.8 + barn.seed * 0.4, inletZ = 0.8 + barn.seed * 0.3;
  const seeds = [
    [inletX, 2.6, inletZ],
    [inletX, 2.6, inletZ + 0.5],
    [inletX, 2.6, inletZ - 0.5],
  ];
  seeds.forEach((seed) => {
    const pts = traceStreamline(seed, tMin, barn);
    if (pts.length >= 2) streamGroup.add(makeStreamTubeFromPoints(pts));
  });
}

function updateStreams(delta) {
  streamGroup.children.forEach((mesh) => {
    mesh.material.map.offset.x -= delta * 0.5; // 흐르는 방향으로 스크롤
  });
}

/* ────────────────────────────────────────────────────────────
   호버 툴팁 — 표면 위 마우스 위치의 x, y, z, 값을 읽어서 표시
   원리는 축사 클릭 때와 동일한 raycasting: 화면 좌표 → 광선 → 교차점 →
   그 교차점을 격자 인덱스로 역변환해 현재 프레임 배열에서 값을 조회.
──────────────────────────────────────────────────────────── */
const hoverRay = new THREE.Raycaster();
const hoverNDC = new THREE.Vector2();
const hoverTooltip = document.getElementById("hoverTooltip");
const _localPt = new THREE.Vector3();

detailCanvas.addEventListener("pointermove", (ev) => {
  if (!selectedBarn || !toggleVolume.checked || !currentFrameArray) {
    hoverTooltip.style.display = "none";
    return;
  }
  const rect = detailCanvas.getBoundingClientRect();
  hoverNDC.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  hoverNDC.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  hoverRay.setFromCamera(hoverNDC, detailCamera);
  const hits = hoverRay.intersectObject(mcEffect);

  if (hits.length === 0) {
    hoverTooltip.style.display = "none";
    return;
  }

  _localPt.copy(hits[0].point);
  mcEffect.worldToLocal(_localPt); // 표면 메시의 로컬 좌표(-1~1)로 변환
  const size = mcResolution;
  const gi = Math.min(size - 1, Math.max(0, Math.round(((_localPt.x + 1) / 2) * (size - 1))));
  const gj = Math.min(size - 1, Math.max(0, Math.round(((_localPt.y + 1) / 2) * (size - 1))));
  const gk = Math.min(size - 1, Math.max(0, Math.round(((_localPt.z + 1) / 2) * (size - 1))));
  const raw = currentFrameArray[gi + gj * size + gk * size * size] / 200; // 0~1 정규화 값
  const tempC = 28 + raw * 6; // 표시용 — 실제 연동 시 물리 단위(°C 등)로 교체

  const p = hits[0].point;
  hoverTooltip.innerHTML =
    `<span class="k">x</span> ${p.x.toFixed(2)}m &nbsp;` +
    `<span class="k">y</span> ${p.y.toFixed(2)}m &nbsp;` +
    `<span class="k">z</span> ${p.z.toFixed(2)}m<br/>` +
    `<span class="k">value</span> ${tempC.toFixed(1)}°C`;
  hoverTooltip.style.left = `${ev.clientX - rect.left + 14}px`;
  hoverTooltip.style.top = `${ev.clientY - rect.top + 14}px`;
  hoverTooltip.style.display = "block";
});
detailCanvas.addEventListener("pointerleave", () => {
  hoverTooltip.style.display = "none";
});

/* ────────────────────────────────────────────────────────────
   패널 열기/닫기 + 정보 카드 + 컨트롤 바인딩
──────────────────────────────────────────────────────────── */
const panel = document.getElementById("detailPanel");
const barnTitleEl = document.getElementById("barnTitle");
const closeBtn = document.getElementById("closeBtn");
const infoTemp = document.getElementById("infoTemp");
const infoHum = document.getElementById("infoHum");
const infoAch = document.getElementById("infoAch");
const infoTime = document.getElementById("infoTime");

const timeSlider = document.getElementById("timeSlider");
const timeLabel = document.getElementById("timeLabel");
const playBtn = document.getElementById("playBtn");
const toggleVolume = document.getElementById("toggleVolume");
const toggleVec = document.getElementById("toggleVec");
const thresholdSlider = document.getElementById("threshold");
const thresholdVal = document.getElementById("thresholdVal");

let selectedBarn = null;
let playing = false;
let playTimer = null;
const clock = new THREE.Clock();
let lastElapsed = 0;

function frameToMinutes(frame) { return frame * 2; }
function currentTMin() { return frameToMinutes(Number(timeSlider.value)); }

function resizeDetailRenderer() {
  const wrap = document.getElementById("detailCanvasWrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  detailRenderer.setSize(w, h, false);
  detailCamera.aspect = w / h;
  detailCamera.updateProjectionMatrix();
}

function selectBarn(id) {
  selectedBarn = BARNS.find((b) => b.id === id);
  barnTitleEl.textContent = selectedBarn.name;
  infoAch.textContent = `${selectedBarn.ach} 회/h`;
  infoHum.textContent = `${selectedBarn.humidity}%`;
  panel.classList.add("open");
  requestAnimationFrame(resizeDetailRenderer); // 패널이 실제로 보인 뒤 크기 계산
}
function closePanel() {
  panel.classList.remove("open");
  selectedBarn = null;
}
closeBtn.addEventListener("click", closePanel);

timeSlider.addEventListener("input", () => { timeLabel.textContent = `${currentTMin()}분`; });
thresholdSlider.addEventListener("input", () => {
  thresholdVal.textContent = Number(thresholdSlider.value).toFixed(2);
});
playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "⏸" : "▶";
  if (playing) {
    playTimer = setInterval(() => {
      let v = Number(timeSlider.value) + 1;
      if (v > 30) v = 0;
      timeSlider.value = v;
      timeLabel.textContent = `${currentTMin()}분`;
    }, 350);
  } else {
    clearInterval(playTimer);
  }
});

/* ────────────────────────────────────────────────────────────
   렌더 루프 / 리사이즈
──────────────────────────────────────────────────────────── */
function resizeMain() {
  const w = mainCanvas.clientWidth, h = mainCanvas.clientHeight;
  mainRenderer.setSize(w, h, false);
  mainCamera.aspect = w / h;
  mainCamera.updateProjectionMatrix();
}
window.addEventListener("resize", () => {
  resizeMain();
  if (panel.classList.contains("open")) resizeDetailRenderer();
});
resizeMain();

(function animate() {
  requestAnimationFrame(animate);
  mainControls.update();
  updateLabels();
  mainRenderer.render(mainScene, mainCamera);

  if (selectedBarn) {
    const tMin = currentTMin();
    const elapsed = clock.getElapsedTime();
    const delta = elapsed - lastElapsed;
    lastElapsed = elapsed;

    mcEffect.visible = toggleVolume.checked;
    streamGroup.visible = toggleVec.checked;
    if (toggleVolume.checked) updateVolume(tMin, selectedBarn, Number(thresholdSlider.value));
    if (toggleVec.checked) {
      rebuildStreamlines(tMin, selectedBarn);
      updateStreams(delta);
    }

    infoTemp.textContent = `${selectedBarn.supplyTemp.toFixed(1)}°C`;
    infoTime.textContent = `${tMin}분`;
    detailControls.update();
    detailRenderer.render(detailScene, detailCamera);
  }
})();
</script>
</body>
</html>
